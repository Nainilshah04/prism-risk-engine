[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "prismrisk"
version = "0.1.0"
description = "Prism Risk Engine: Multi-Asset Portfolio Risk & Scenario Engine"
authors = [{ name = "Nainil Shah" }]
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "pandas>=2.0.0",
    "numpy>=1.24.0",
    "scipy>=1.10.0",
    "statsmodels>=0.14.0",
    "scikit-learn>=1.3.0",
    "pydantic>=2.0.0",
    "pyyaml>=6.0",
    "pyarrow>=12.0.0",
    "yfinance>=0.2.30",
    "typer>=0.9.0",
    "jinja2>=3.1.0",
    "matplotlib>=3.7.0",
    "plotly>=5.15.0",
    "streamlit>=1.30.0",
]

[project.scripts]
prismrisk = "prismrisk.cli:app"
riskengine = "prismrisk.cli:app"

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "pytest-cov>=4.1.0",
    "ruff>=0.1.0",
    "mypy>=1.5.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = "-v --strict-markers"

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
ignore_missing_imports = true
